[project]
name = "tableau-cohort-analysis"
version = "0.1.0"
description = "Cohort retention + LTV analysis with synthetic data, matplotlib visualizations, and a Tableau-ready export."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tableauhyperapi>=0.0.22100",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]