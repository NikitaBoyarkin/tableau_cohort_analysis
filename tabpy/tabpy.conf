[TabPy]
# TabPy server configuration for local development.
# Every key below is taken verbatim from tabpy_server/common/default.conf.
# Start the server with: tabpy --config=tabpy/tabpy.conf

# TCP port the TabPy server listens on. Must match the analytics extension
# connection configured in Tableau (Desktop: Manage Analytics Extension
# Connection; Server: Analytics Extensions settings).
TABPY_PORT = 9004

# Run ad-hoc Python sent to /evaluate. Enabled by default in TabPy; disabling
# it makes /evaluate return 404.
TABPY_EVALUATE_ENABLE = true

# Seconds a custom script from /evaluate may run before TabPy raises
# TimeoutError. Float. TabPy's default is 30; 60 leaves room for forecasts on
# wide cohorts.
TABPY_EVALUATE_TIMEOUT = 60

# http or https. Keep http only for localhost: HTTP means credentials and query
# data travel in clear text.
TABPY_TRANSFER_PROTOCOL = http

# Reject any request larger than this many MB. TabPy's default is 100; 20 is
# plenty for cohort tables and limits the blast radius of a malformed upload.
TABPY_MAX_REQUEST_SIZE_MB = 20

# --- Authentication ---
# WARNING: authentication is DISABLED in this file. With TABPY_EVALUATE_ENABLE
# also true, anyone who can reach the port can execute arbitrary Python
# (remote code execution). This is acceptable only on a trusted local machine.
# To enable password auth, uncomment the line below and point it at the
# password file created with tabpy-user (one "username:hashed-password" per
# line). The deploy script then needs --username/--password.
# TABPY_PWD_FILE = /absolute/path/to/tabpy/passwords.txt

# --- HTTPS ---
# For TLS, set TABPY_TRANSFER_PROTOCOL = https and uncomment the certificate,
# key and minimum TLS version lines below (PEM-encoded x509 only).
# TABPY_CERTIFICATE_FILE = /path/to/certificate/file.crt
# TABPY_KEY_FILE = /path/to/key/file.key
# TABPY_MINIMUM_TLS_VERSION = TLSv1_2

# --- OAuth / JWT (alternative to the password file) ---
# Uncomment and configure all required lines to validate Bearer tokens.
# TABPY_OAUTH_ISSUER and TABPY_OAUTH_JWKS_URI are required; at least one
# resource boundary (TABPY_OAUTH_AUDIENCE or TABPY_OAUTH_REQUIRED_SCOPES) is
# mandatory.
# TABPY_OAUTH_ENABLED = true
# TABPY_OAUTH_ISSUER = https://idp.example.com/
# TABPY_OAUTH_JWKS_URI = https://idp.example.com/.well-known/jwks.json
# TABPY_OAUTH_AUDIENCE = api://tabpy
