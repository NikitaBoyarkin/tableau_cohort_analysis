name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Smoke-test the pipeline
        run: |
          uv run python cohort_analysis.py > /dev/null
          uv run python tableau_export.py
          test -f tableau/cohort_export.csv
          test -f tableau/cohort_extract.hyper
